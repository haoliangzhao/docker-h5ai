server {
    listen  80 default_server;
    listen  [::]:80 default_server;
    server_name _;

    root /h5ai;
    index index.html index.htm /_h5ai/public/index.php;

    # Only these audited application entry points may execute PHP.
    location = /_h5ai/public/index.php {
        root /usr/share/h5ai;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/share/h5ai/_h5ai/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /_h5ai/public/heif-preview.php {
        root /usr/share/h5ai;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/share/h5ai/_h5ai/public/heif-preview.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /_h5ai/private/ {
        return 404;
    }

    location /_h5ai/ {
        root /usr/share/h5ai;
    }

    # Optional, administrator-owned exact PHP page locations. Empty by default.
    include /config/nginx/php-pages/*.conf;

    # redirect server error pages to the static page /50x.html
    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Reject PHP-like files and PATH_INFO, including caches and shared files.
    # Do not serve rejected scripts as static source. Exact locations above win.
    location ~* \.(?:php[0-9]*|phtml|phar)(?:$|[/.]) {
        return 404;
    }

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    location ~ /\.ht {
        deny  all;
    }

    # For letsencrypt
    location /.well-known/acme-challenge/ {
        alias /var/www/challenges/;
        try_files $uri =404;
    }
}
